# CodeJudge – toàn bộ hệ thống.
#
#   cp .env.example .env              # (tùy chọn) đổi mật khẩu / cổng
#   docker compose up -d --build      # db + backend + frontend + go-judge
#   docker compose --profile demo up -d seed   # nạp dữ liệu demo (admin/admin123, 10 đề, 3 kỳ thi)
#
#   Web:       http://localhost:18080
#   Master:    HTTP :18000, WebSocket :18001
#   go-judge:  REST :5050  (nội bộ, backend gọi http://go-judge:5050)
#   Chỉ DB:    docker compose up -d db
#
# LƯU Ý: go-judge cần Linux kernel (cgroups + namespaces). Trên Windows/macOS
#         cần Docker Desktop với WSL2 backend; trên macOS chạy trong sandbox
#         giới hạn (không có cgroup memory).

name: codejudge

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-codejudge}
      POSTGRES_USER: ${DB_USERNAME:-codejudge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codejudge}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"   # 15432: tránh Hyper-V/Windows reserved range
    volumes:
      - db-data:/var/lib/postgresql   # postgres:18 lưu dữ liệu dưới /var/lib/postgresql/18/docker
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    networks: [default]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    image: codejudge/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8000
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-codejudge}
      DB_USERNAME: ${DB_USERNAME:-codejudge}
      DB_PASSWORD: ${DB_PASSWORD:-codejudge}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GO_JUDGE_URL: http://go-judge:5050
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "18000:8000"   # HTTP REST
      - "18001:8001"   # WebSocket
      - "8001:8001"    # WebSocket (khop voi Web UI)
    networks: [default, judge]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      start_period: 40s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    image: codejudge/frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-18080}:80"
    networks: [default]

  go-judge:
    build: ./go-judge-custom
    image: codejudge/go-judge
    restart: unless-stopped
    privileged: true          # bắt buộc: cần cgroup + namespace để sandbox
    shm_size: 256m
    command:
      - -http-addr=0.0.0.0:5050        # lắng nghe mọi interface trong container
      - -auth-token=${GO_JUDGE_TOKEN:-}  # để trống = không cần token (set trong .env để bật)
      - -parallelism=${GO_JUDGE_PARALLELISM:-4}
      - -release
    networks: [judge]         # chỉ backend mới gọi được; code thí sinh không ra ngoài
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/version', timeout=3).read()"]
      interval: 10s
      start_period: 15s
      retries: 5

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MASTER_HOST: backend
      MASTER_PORT: 9000
      GO_JUDGE_URL: http://go-judge:5050
      WORKER_ID: ""   # để trống → dùng hostname container (tự động unique khi scale)
      TZ: Asia/Ho_Chi_Minh
    networks: [default, judge]

  # Nạp dữ liệu demo sau khi Flyway (trong backend) đã tạo bảng. Xóa sạch dữ liệu cũ!
  seed:
    image: postgres:18
    profiles: [demo]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-codejudge}
      PGUSER: ${DB_USERNAME:-codejudge}
      PGPASSWORD: ${DB_PASSWORD:-codejudge}
    volumes:
      - ./backend/src/main/resources/db/seed:/seed:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/seed/demo_data.sql"]
    networks: [default]
    restart: "no"

networks:
  default:
  judge:
    internal: true   # backend ↔ go-judge; code thí sinh không ra Internet

volumes:
  db-data:
  redis-data:
