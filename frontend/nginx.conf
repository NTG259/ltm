server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Dùng DNS của Docker để re-resolve tên service sau mỗi lần rebuild
    resolver 127.0.0.11 valid=5s ipv6=off;

    # WebSocket Realtime (proxy ngược vào Master :8001)
    location /ws {
        set $backend_ws backend;
        proxy_pass http://$backend_ws:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API của Master (cùng origin nên không cần CORS).
    location /api/ {
        set $backend_api backend;
        proxy_pass http://$backend_api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # File build có hash trong tên: cache lâu dài.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
