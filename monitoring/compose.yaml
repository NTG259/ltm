name: codejudge
services:
  metrics-exporter:
    build: ./exporter
    profiles: [monitoring]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-codejudge}
      DB_USERNAME: ${DB_USERNAME:-codejudge}
      DB_PASSWORD: ${DB_PASSWORD:-codejudge}
    networks: [default]
    ports: ["127.0.0.1:19100:9100"]
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [monitoring]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:19090:9090"]
    networks: [default]
  grafana:
    image: grafana/grafana:12.3.0
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../results/chapter7/06-grafana:/var/lib/grafana/chapter7:ro
    ports: ["127.0.0.1:13000:3000"]
    networks: [default]
  renderer:
    image: grafana/grafana-image-renderer@sha256:a7970b826f6e477461e02bf5463d92634e9ad27d525e4e50296978a2e592d2d7
    profiles: [monitoring]
    networks: [default]
  cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    profiles: [monitoring]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports: ["127.0.0.1:18090:8080"]
    networks: [default]
networks:
  default:
    external: true
    name: codejudge_default
