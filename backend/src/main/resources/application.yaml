spring:
  application:
    name: backend

  # Mặc định trỏ tới PostgreSQL của compose.yaml (cổng 5433 trên máy);
  # ghi đè bằng biến môi trường khi triển khai.
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-rapid-bar-az6bb10g-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_JFQV3Eyr0iaN}

  # Lược đồ do Flyway quản lý (db/migration); Hibernate chỉ kiểm tra entity khớp với bảng.
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true

# Master Server: HTTP REST :8000 (WebSocket :8001 và TCP Worker :9000 sẽ do các server riêng mở).
server:
  port: ${SERVER_PORT:8000}

# Chỉ mở /actuator/health (dùng cho healthcheck của Docker).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
