spring:
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Mặc định trỏ tới PostgreSQL của compose.yaml (cổng 5433 trên máy);
  # ghi đè bằng biến môi trường khi triển khai.
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-rapid-bar-az6bb10g-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_JFQV3Eyr0iaN}

    hikari:
      max-lifetime: 300000
      idle-timeout: 120000
      connection-timeout: 30000
      keepalive-time: 45000

  # Lược đồ do Flyway quản lý (db/migration); Hibernate chỉ kiểm tra entity khớp với bảng.
  flyway:
    locations: classpath:db/migration
    out-of-order: true
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

# Master Server: HTTP REST :8000 (WebSocket :8001 và TCP Worker :9000 sẽ do các server riêng mở).
server:
  port: ${SERVER_PORT:8082}

# Chỉ mở /actuator/health (dùng cho healthcheck của Docker).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
